name: Publish Family image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sujianleo/family
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-fnos-package:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $tag" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify published multi-architecture image
        run: |
          set -euo pipefail
          image="ghcr.io/sujianleo/family:${GITHUB_REF_NAME}"
          manifest="$(docker buildx imagetools inspect "$image")"
          grep -q 'linux/amd64' <<<"$manifest"
          grep -q 'linux/arm64' <<<"$manifest"

      - name: Build and verify fnOS packages
        run: ./packaging/fnos/build-fpk.sh "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: fanmili-fnos-${{ steps.version.outputs.version }}
          path: |
            dist/fnos/*.fpk
            dist/fnos/SHA256SUMS
          if-no-files-found: error

      - name: Publish fnOS assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/fnos/*.fpk dist/fnos/SHA256SUMS --clobber
          else
            gh release create "$tag" dist/fnos/*.fpk dist/fnos/SHA256SUMS \
              --verify-tag \
              --generate-notes \
              --notes $'## fnOS validation\n\n- Automated: FPK structure, checksums, lifecycle script syntax, and linux/amd64 + linux/arm64 image manifests passed.\n- Real fnOS device: not claimed by CI; maintainers append the tested fnOS version and hardware architecture after manual installation.' \
              --title "Fanmili $tag"
          fi
